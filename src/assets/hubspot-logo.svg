<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" aria-hidden="true">
  <rect width="32" height="32" rx="7" fill="#FF7A59"/>
  <!-- Sprocket: white ring + 3 arms with spheres (0°, 120°, 240°) -->
  <g fill="#fff">
    <circle cx="16" cy="16" r="6"/>
    <circle cx="16" cy="16" r="4" fill="#FF7A59"/>
    <!-- Arm up -->
    <rect x="15" y="4" width="2" height="8" rx="1"/>
    <circle cx="16" cy="3" r="2.5"/>
    <!-- Arm down-right -->
    <g transform="rotate(120 16 16)">
      <rect x="15" y="4" width="2" height="8" rx="1"/>
      <circle cx="16" cy="3" r="2.5"/>
    </g>
    <!-- Arm down-left -->
    <g transform="rotate(240 16 16)">
      <rect x="15" y="4" width="2" height="8" rx="1"/>
      <circle cx="16" cy="3" r="2.5"/>
    </g>
  </g>
</svg>
